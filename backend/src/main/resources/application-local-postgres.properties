# ローカル PostgreSQL との互換性確認用設定。
# 実値は Git 管理対象外の共通シークレットファイルまたは環境変数から受け取る。

spring.config.import=optional:file:${LOCAL_SECRETS_FILE:./config/application-local-secrets.properties}

spring.datasource.url=${LOCAL_DB_URL:${local.postgres.datasource.url:jdbc:postgresql://localhost:5432/personal_develop_db}}
spring.datasource.username=${LOCAL_DB_USERNAME:${local.postgres.datasource.username}}
spring.datasource.password=${LOCAL_DB_PASSWORD:${local.postgres.datasource.password}}
spring.jpa.hibernate.ddl-auto=update

google.api.key=${GOOGLE_GEOCODING_API_KEY:${local.google.geocoding-api-key}}
line.bot.channelSecret=${LINE_CHANNEL_SECRET:${local.line.channel-secret}}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${local.cors.allowed-origins:http://localhost:5173}}
